[versions]
agp = "9.3.0"

# AGP 9 内置 Kotlin 支持，此版本必须与 AGP 9.3.0 自带的 Kotlin 版本严格一致
# （见 AGP 9.3.0 POM 中 org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.10）。
# 升级 AGP 时需同步核对并调整此版本，否则 Compose 编译器插件会与 Kotlin 编译器不匹配。
kotlin = "2.2.10"

# --- 需求基线：Jetpack Compose + Material 3（SRS 2.5）---
# 版本取 M0 当天各自最新稳定版（2026-09-12 查询 Google Maven / Maven Central 确认）
composeBom = "2026.09.00"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
navigationCompose = "2.10.1"

# --- 数据与异步（SRS 5.3 / FR-14）---
datastore = "1.2.1"
coroutines = "1.11.0"

coreKtx = "1.19.0"

# --- 配色生成（V1.3）---
# 标准 M3 色调板算法。官方 material-color-utilities 未发布到 Maven Central，
# 这里用 me.tatarka 对 Google 官方源码的原样转发（已下载 jar 核对 API：
# Hct / TonalPalette / SchemeContent / SchemeTonalSpot / DynamicScheme 齐全，纯 JVM 无传递依赖）。
materialColorUtilities = "0.1.2"

# --- 测试 ---
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }

# 配色生成（V1.3）
material-color-utilities = { group = "me.tatarka.google.material", name = "material-color-utilities", version.ref = "materialColorUtilities" }

# Compose（版本由 BOM 统一管理）
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

# Lifecycle / Navigation
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

# 数据与异步
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

# 测试
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# Kotlin 2.0 起 Compose 编译器由独立 Gradle 插件提供；
# AGP 9 内置 Kotlin 不需要 kotlin-android 插件，但 Compose 仍需显式应用本插件。
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
